<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c35">
<meta name="description" content="حساباتي: إدارة المشاريع والدفعات وأجور العمال والعائلة والمدخرات">
<link rel="manifest" href="manifest.json">
<title>حساباتي</title>
<style>
:root{--green:#123c35;--green2:#1b5b4d;--mint:#e4f1eb;--bg:#f4f7f5;--card:#fff;--text:#172522;--muted:#64736e;--line:#dce5e0;--amber:#a85c10;--red:#b42318;--blue:#2355a6;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:920px;margin:auto;min-height:100dvh;padding-bottom:88px}.top{background:var(--green);color:white;padding:20px 16px 18px;border-radius:0 0 26px 26px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;display:grid;place-items:center;background:#d7efc7;color:var(--green);border-radius:15px;font-size:26px}.brand h1{margin:0;font-size:24px}.brand p{margin:2px 0 0;color:#d5e6df;font-size:13px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.today{font-size:12px;color:#d5e6df}.topactions{display:flex;gap:8px;margin-top:16px}.topactions button{flex:1}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--green2);color:white;font-weight:650}.btn.light{background:#fff;color:var(--green)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.danger{background:#fff0ef;color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.content{padding:16px}.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:7px max(5px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));overflow-x:auto}.nav button{flex:1;max-width:140px;min-width:54px;background:transparent;border:0;border-radius:12px;padding:7px 4px;color:var(--muted);font-size:11px;display:flex;align-items:center;flex-direction:column;gap:3px}.nav button span{font-size:20px}.nav button.active{background:var(--mint);color:var(--green);font-weight:750}.section-title{font-size:20px;margin:0 0 4px}.sub{font-size:13px;color:var(--muted);margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:12px;min-width:0}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:clamp(17px,4vw,23px);font-weight:800;margin-top:5px;overflow-wrap:anywhere}.metric .hint{font-size:11px;color:var(--muted);margin-top:3px}.good{color:#167448}.warn{color:var(--amber)}.bad{color:var(--red)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid #cbd8d1;border-radius:11px;padding:11px;background:white;color:var(--text)}.field textarea{min-height:76px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .btn{flex:1}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.pill{font-size:11px;border-radius:99px;padding:4px 8px;background:var(--mint);color:var(--green);white-space:nowrap}.pill.amber{background:#fff0d8;color:#854b08}.pill.red{background:#ffe9e7;color:var(--red)}.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.item h3{font-size:15px;margin:0 0 3px}.item p{font-size:12px;color:var(--muted);margin:2px 0}.item .item-actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.empty{text-align:center;padding:25px 12px;color:var(--muted);background:#fff;border:1px dashed #cbd8d1;border-radius:16px}.empty b{display:block;color:var(--text);margin-bottom:5px}.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.quick button{border:1px solid var(--line);border-radius:13px;background:white;padding:12px 5px;color:var(--text);font-size:12px}.quick button span{display:block;font-size:21px;margin-bottom:3px}.notice{border-radius:12px;background:#fff7e7;border:1px solid #f1d7a7;padding:11px 12px;color:#704a12;font-size:12px;margin:10px 0}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:99px;padding:8px 12px;color:var(--muted);font-size:12px}.tabs button.active{background:var(--green);border-color:var(--green);color:white}.tablewrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:right;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-weight:700}.hidden{display:none!important}.toast{position:fixed;z-index:10;bottom:90px;left:50%;transform:translateX(-50%);background:#1e2c28;color:white;padding:10px 15px;border-radius:12px;box-shadow:0 6px 25px #0002;max-width:90vw;font-size:13px}.modalback{position:fixed;z-index:8;inset:0;background:#071b16a8;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(100%,620px);max-height:90dvh;overflow:auto;background:var(--bg);border-radius:22px;padding:16px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.modalhead h2{font-size:19px;margin:0}.close{border:0;border-radius:10px;padding:8px 12px;background:#e6eeea}.smallmuted{font-size:11px;color:var(--muted)}.progress{height:8px;background:#e7ede9;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#2b8a63;border-radius:99px}.footer-note{font-size:11px;color:var(--muted);text-align:center;margin:18px 4px}
@media(min-width:680px){.content{padding:22px}.top{padding:24px 24px 22px}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{top:0;bottom:auto;left:auto;right:calc((100vw - min(920px,100vw))/2);width:min(920px,100%);position:sticky;border:0;background:transparent;justify-content:flex-start;padding:10px 18px;margin-top:-57px;pointer-events:none}.nav button{pointer-events:auto;background:#ffffff15;color:#e5f0eb}.nav button.active{background:#d7efc7;color:var(--green)}.app{padding-bottom:20px}.topactions{max-width:450px}.modalback{align-items:center}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="toprow">
    <div class="brand"><div class="logo">▦</div><div><h1>حساباتي</h1><p>شغلك، عائلتك، ومدخراتك في مكان واحد</p></div></div>
    <div class="today" id="today"></div>
  </div>
  <div class="topactions"><button class="btn light" onclick="openTransaction()">＋ تسجيل حركة</button><button class="btn" onclick="exportBackup()">⬇ نسخة احتياطية</button></div>
</header>
<nav class="nav" id="nav">
  <button data-page="home" class="active"><span>⌂</span>الرئيسية</button>
  <button data-page="projects"><span>▣</span>المشاريع</button>
  <button data-page="workers"><span>♙</span>العمال</button>
  <button data-page="family"><span>⌂</span>العائلة</button>
  <button data-page="savings"><span>◇</span>المدخرات</button>
  <button data-page="reports"><span>▤</span>التقارير</button>
  <button data-page="settings"><span>⚙</span>الإعدادات</button>
</nav>
<main class="content" id="main"></main>
<div class="footer-note">حساباتي — نسخة محلية تجريبية. احتفظ بنسخة احتياطية من بياناتك بانتظام.</div>
</div>
<div id="modalroot"></div><div id="toast" class="toast hidden"></div>
<input id="importFile" type="file" accept="application/json,.json" class="hidden">

<script>
const KEY='hesabati_v1';
const todayISO=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const money=(n,c='SYP')=>`${fmt(n)} ${c==='USD'?'$':'ل.س'}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const defaultData=()=>({version:1,settings:{currency:'SYP',exchangeRate:11000},projects:[],workers:[],transactions:[],savings:{SYP:0,USD:0}});
let db=load(),page='home',projectFilter='all',reportPeriod='month';
function load(){try{return {...defaultData(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return defaultData()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2300)}
function dateText(d){if(!d)return '—';try{return new Date(d+'T12:00:00').toLocaleDateString('ar-SY')}catch(e){return d}}
function navTo(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)navTo(b.dataset.page)});
document.getElementById('today').textContent=new Date().toLocaleDateString('ar-SY',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
function txAdd(tx){db.transactions.unshift({id:id(),date:todayISO(),currency:'SYP',category:'',note:'',...tx,createdAt:new Date().toISOString()});save();render();toast('تم حفظ الحركة')}
function txSum(types,from=null,to=null,currency='SYP'){return db.transactions.filter(t=>types.includes(t.type)&&t.currency===currency&&(!from||t.date>=from)&&(!to||t.date<=to)).reduce((s,t)=>s+Number(t.amount||0),0)}
function projectReceived(p){return db.transactions.filter(t=>t.type==='receipt'&&t.projectId===p.id).reduce((s,t)=>s+Number(t.amount||0),0)}
function projectCosts(p){return db.transactions.filter(t=>['project_cost','wage_earned'].includes(t.type)&&t.projectId===p.id).reduce((s,t)=>s+Number(t.amount||0),0)}
function workerEarned(w,from=null,to=null){return db.transactions.filter(t=>t.type==='wage_earned'&&t.workerId===w.id&&(!from||t.date>=from)&&(!to||t.date<=to)).reduce((s,t)=>s+Number(t.amount||0),0)}
function workerPaid(w,from=null,to=null){return db.transactions.filter(t=>t.type==='worker_payment'&&t.workerId===w.id&&(!from||t.date>=from)&&(!to||t.date<=to)).reduce((s,t)=>s+Number(t.amount||0),0)}
function sumBy(type,from=null,to=null,currency='SYP'){return txSum([type],from,to,currency)}
function allCash(currency='SYP'){return txSum(['receipt','other_income'],null,null,currency)-txSum(['project_cost','worker_payment','family_expense','other_expense','savings_deposit'],null,null,currency)+txSum(['savings_withdraw'],null,null,currency)}
function projectStats(p){const received=projectReceived(p),costs=projectCosts(p),agreement=Number(p.agreement||0);const earned=agreement;return {received,balance:Math.max(0,agreement-received),costs,profit:earned-costs,progress:agreement>0?Math.min(100,received/agreement*100):0}}
function cardMetric(label,value,hint='',cls=''){return `<div class="card metric"><div class="label">${label}</div><div class="value ${cls}">${value}</div>${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function empty(title,desc,action=''){return `<div class="empty"><b>${title}</b>${desc}${action?`<div style="margin-top:12px">${action}</div>`:''}</div>`}
function button(label,fn,kind='outline'){return `<button class="btn ${kind} small" onclick="${fn}">${label}</button>`}
function render(){const m=document.getElementById('main');if(page==='home')m.innerHTML=homePage();else if(page==='projects')m.innerHTML=projectsPage();else if(page==='workers')m.innerHTML=workersPage();else if(page==='family')m.innerHTML=familyPage();else if(page==='savings')m.innerHTML=savingsPage();else if(page==='reports')m.innerHTML=reportsPage();else m.innerHTML=settingsPage()}
function homePage(){
 const active=db.projects.filter(p=>p.status!=='closed').length,received=txSum(['receipt']),out=txSum(['project_cost','worker_payment','family_expense','other_expense']),family=txSum(['family_expense']),wage=txSum(['worker_payment']),balance=db.projects.reduce((s,p)=>s+projectStats(p).balance,0),cash=allCash();
 const recent=db.transactions.slice(0,5);
 return `<h2 class="section-title">أهلًا بك 👋</h2><p class="sub">هذه صورة سريعة عن وضعك المالي المسجل.</p>
 <div class="grid">${cardMetric('السيولة المسجلة',money(cash),'القبض الفعلي ناقص المدفوعات الفعلية',cash<0?'bad':'good')}${cardMetric('مستحقات الزبائن',money(balance),'دفعات لم تُقبض بعد','warn')}${cardMetric('المشاريع المفتوحة',fmt(active),'مشاريع لم تُغلق بعد')}${cardMetric('مدخراتك',`${money(db.savings.SYP)} + ${money(db.savings.USD,'USD')}`,'أرصدة منفصلة حسب العملة')}</div>
 <div class="card"><div class="row"><h3 style="margin:0">إضافة سريعة</h3><span class="pill">اختصارات</span></div><p class="sub" style="margin-top:4px">اختر نوع الحركة لتسجيلها مباشرة.</p><div class="quick">
 <button onclick="openTransaction('receipt')"><span>💵</span>دفعة زبون</button><button onclick="openTransaction('project_cost')"><span>🧰</span>تكلفة مشروع</button><button onclick="openTransaction('worker_payment')"><span>👷</span>أجر عامل</button><button onclick="openTransaction('family_expense','قهوة')"><span>☕</span>قهوة</button><button onclick="openTransaction('family_expense','طعام')"><span>🍽️</span>طعام</button><button onclick="openTransaction('savings_deposit')"><span>🐖</span>ادخار</button></div></div>
 <div class="grid">${cardMetric('إجمالي المقبوض',money(received),'دفعات زبائن مسجلة')}${cardMetric('إجمالي المدفوع',money(out),'تكاليف وأجور ومصاريف')}${cardMetric('أجور العمال المدفوعة',money(wage),'ضمن سجل الحركات')}${cardMetric('مصروف العائلة',money(family),'منفصل عن الشغل')}</div>
 <div class="card"><div class="row"><h3 style="margin:0">آخر الحركات</h3>${button('عرض الكل',`navTo('reports')`)}</div>${recent.length?`<div class="list" style="margin-top:10px">${recent.map(txItem).join('')}</div>`:empty('لا توجد حركات بعد','ابدأ بإضافة مشروع ثم سجّل الدفعات والمصاريف.',button('إضافة مشروع',`openProject()`,''))}</div>
 <div class="notice">تنبيه محاسبي: مستحقات الزبائن ليست سيولة متوفرة. السيولة هنا تُحسب من الحركات الفعلية المسجلة فقط. نقل المال بين حساباتك لا يُسجَّل كدخل أو مصروف.</div>`;
}
function txLabel(t){return ({receipt:'قبض من زبون',other_income:'دخل آخر',project_cost:'تكلفة مشروع',worker_payment:'دفع أجر عامل',wage_earned:'استحقاق أجر عامل',family_expense:'مصروف عائلة',other_expense:'مصروف آخر',savings_deposit:'إيداع مدخرات',savings_withdraw:'سحب مدخرات',transfer:'تحويل بين حسابات',adjustment:'تسوية رصيد'})[t.type]||t.type}
function txItem(t){let sign=['receipt','other_income','savings_withdraw'].includes(t.type)?'+':'−';let cls=['receipt','other_income','savings_withdraw'].includes(t.type)?'good':(['wage_earned'].includes(t.type)?'warn':'');return `<div class="item"><div class="row"><div style="min-width:0"><h3>${esc(t.note||txLabel(t))}</h3><p>${esc(txLabel(t))}${t.projectId?' · '+esc(db.projects.find(p=>p.id===t.projectId)?.name||'مشروع محذوف'):''}${t.workerId?' · '+esc(db.workers.find(w=>w.id===t.workerId)?.name||'عامل محذوف'):''}</p><p>${dateText(t.date)} ${t.category?'· '+esc(t.category):''}</p></div><div style="text-align:left"><b class="${cls}">${sign} ${money(t.amount,t.currency)}</b></div></div><div class="item-actions">${button('تعديل',`editTransaction('${t.id}')`)}${button('حذف',`deleteTransaction('${t.id}')`,'danger')}</div></div>`}
function projectsPage(){return `<div class="row"><div><h2 class="section-title">المشاريع</h2><p class="sub">قيمة الاتفاق، الدفعات الجزئية، التكاليف والربح.</p></div>${button('＋ مشروع جديد',`openProject()`,'')}</div>
 ${db.projects.length?`<div class="list">${db.projects.map(p=>{const s=projectStats(p);return `<div class="item"><div class="row"><div><h3>${esc(p.name)}</h3><p>الزبون: ${esc(p.client||'غير محدد')} · ${dateText(p.startDate)}</p></div><span class="pill ${p.status==='closed'?'':'amber'}">${p.status==='closed'?'مغلق':'مفتوح'}</span></div><div class="grid" style="gap:6px;margin-top:10px">${miniMetric('الاتفاق',money(p.agreement))}${miniMetric('المقبوض',money(s.received))}${miniMetric('المتبقي',money(s.balance))}${miniMetric('الربح التقديري',money(s.profit))}</div><div class="progress"><i style="width:${s.progress}%"></i></div><p>${s.progress.toFixed(0)}% من قيمة الاتفاق تم قبضه</p><div class="item-actions">${button('＋ دفعة قبض',`openTransaction('receipt', '', '${p.id}')`,'')}${button('＋ تكلفة',`openTransaction('project_cost','','${p.id}')`)}${button('تفاصيل',`projectDetails('${p.id}')`)}${button(p.status==='closed'?'إعادة فتح':'إغلاق',`toggleProject('${p.id}')`)}${button('حذف',`deleteProject('${p.id}')`,'danger')}</div></div>`}).join('')}</div>`:empty('لا توجد مشاريع مسجلة','أضف مشروعًا لتسجيل قيمة الاتفاق والدفعات الجزئية والتكاليف.',button('＋ إنشاء أول مشروع',`openProject()`,''))}
 <div class="notice">الربح التقديري = قيمة الاتفاق − التكاليف المسجلة − أجور العمال المسجلة المرتبطة بالمشروع. حدّث التكاليف باستمرار لتحصل على نتيجة أدق.</div>`}
function miniMetric(label,val){return `<div style="background:var(--bg);border-radius:10px;padding:8px"><div class="smallmuted">${label}</div><b style="font-size:13px">${val}</b></div>`}
function workersPage(){const list=db.workers;return `<div class="row"><div><h2 class="section-title">العمال وأجورهم</h2><p class="sub">الأجر يومي، مع تسجيل الاستحقاق والدفع بشكل منفصل.</p></div>${button('＋ عامل جديد',`openWorker()`,'')}</div>
 <div class="notice">سجّل «استحقاق أجر» عند انتهاء يوم العمل، ثم سجّل «دفع أجر عامل» عند الدفع. هكذا يظهر ما يستحقه العامل وما دُفع له فعلًا دون خلطهما.</div>
 ${list.length?`<div class="list">${list.map(w=>{const earned=workerEarned(w),paid=workerPaid(w),due=earned-paid;return `<div class="item"><div class="row"><div><h3>${esc(w.name)}</h3><p>أجر اليوم: ${money(w.dailyRate)}${w.phone?' · '+esc(w.phone):''}</p></div><span class="pill ${due>0?'amber':''}">${due>0?'له مستحقات':'مسدد'}</span></div><div class="grid" style="gap:6px;margin-top:10px">${miniMetric('إجمالي الاستحقاق',money(earned))}${miniMetric('المدفوع',money(paid))}${miniMetric('المتبقي للعامل',money(due))}</div><div class="item-actions">${button('＋ يوم عمل',`recordWork('${w.id}')`,'')}${button('＋ دفع أجر',`openTransaction('worker_payment','','', '${w.id}')`)}${button('تعديل',`openWorker('${w.id}')`)}${button('حذف',`deleteWorker('${w.id}')`,'danger')}</div></div>`}).join('')}</div>`:empty('لم تضف عمالًا بعد','أضف العمال مرة واحدة، ثم سجّل أيام العمل والمدفوعات.',button('＋ إضافة عامل',`openWorker()`,''))}
 <div class="card"><h3 style="margin-top:0">ملخص الأجور</h3><div class="grid">${cardMetric('إجمالي الاستحقاقات',money(txSum(['wage_earned'])))}${cardMetric('إجمالي المدفوع',money(txSum(['worker_payment'])))}${cardMetric('المتبقي للعمال',money(txSum(['wage_earned'])-txSum(['worker_payment'])))}</div></div>`}

const txTypeLabels={receipt:'قبض دفعة من زبون',other_income:'دخل آخر',project_cost:'تكلفة مشروع',worker_payment:'دفع أجر عامل',family_expense:'مصروف عائلة',other_expense:'مصروف آخر',savings_deposit:'إيداع مدخرات',savings_withdraw:'سحب مدخرات',adjustment:'تسوية رصيد'};
function openTransaction(type='receipt',category='',projectId='',workerId=''){const defaultType=type||'receipt';const isSaving=['savings_deposit','savings_withdraw'].includes(defaultType);const typeOptions=Object.entries(txTypeLabels).map(([v,l])=>`<option value="${v}" ${v===defaultType?'selected':''}>${l}</option>`).join('');modal('تسجيل حركة مالية',`<form id="txForm" class="formgrid"><div class="field full"><label>نوع الحركة *</label><select name="type" id="txType">${typeOptions}</select></div><div class="field"><label>المبلغ *</label><input name="amount" type="number" min="0.01" step="any" required placeholder="0"></div><div class="field"><label>العملة</label><select name="currency"><option value="SYP">ليرة سورية</option><option value="USD">دولار أمريكي</option></select></div><div class="field"><label>التاريخ *</label><input name="date" type="date" required value="${todayISO()}"></div><div class="field"><label>التصنيف</label><input name="category" value="${esc(category)}" placeholder="مثلاً: مواد، نقل، طعام"></div><div class="field full" id="projectField"><label>المشروع</label><select name="projectId"><option value="">بدون مشروع</option>${db.projects.map(p=>`<option value="${p.id}" ${p.id===projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field full" id="workerField"><label>العامل</label><select name="workerId"><option value="">اختر العامل</option>${db.workers.map(w=>`<option value="${w.id}" ${w.id===workerId?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div><div class="field full"><label>ملاحظة / اسم الزبون / رقم الدفعة</label><input name="note" placeholder="مثلاً: الدفعة الثانية من الاتفاق"></div><div class="field full"><button class="btn" type="submit">حفظ الحركة</button></div></form><p class="smallmuted">تسجيل دفعة قبض لا يزيد قيمة الاتفاق؛ بل يضيف إلى المبلغ المقبوض ويقلل المستحق. الإيداع والسحب يُحدّثان رصيد المدخرات.</p>`);
 const form=document.getElementById('txForm'),sel=document.getElementById('txType');const update=()=>{document.getElementById('projectField').classList.toggle('hidden',!['receipt','project_cost','worker_payment','wage_earned'].includes(sel.value));document.getElementById('workerField').classList.toggle('hidden',!['worker_payment'].includes(sel.value));};sel.addEventListener('change',update);update();
 form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),ty=f.get('type'),amount=Number(f.get('amount')),currency=f.get('currency');if(!Number.isFinite(amount)||amount<=0)return toast('أدخل مبلغًا صحيحًا');if(ty==='worker_payment'&&!f.get('workerId'))return toast('اختر العامل');if(['savings_deposit','savings_withdraw'].includes(ty)){const key=currency==='USD'?'USD':'SYP';if(ty==='savings_deposit'){if(amount>allCash(key))return toast('السيولة المسجلة غير كافية لهذا الإيداع');db.savings[key]+=amount}else{if(amount>db.savings[key])return toast('رصيد المدخرات غير كافٍ');db.savings[key]-=amount}}
 txAdd({type:ty,amount,currency,date:f.get('date'),category:f.get('category'),projectId:f.get('projectId')||'',workerId:f.get('workerId')||'',note:f.get('note')||txTypeLabels[ty]||'حركة مالية'});closeModal();render();}
}
function editTransaction(tid){const t=db.transactions.find(x=>x.id===tid);if(!t)return;modal('تعديل الحركة',`<form id="editTx" class="formgrid"><div class="field full"><label>نوع الحركة</label><select name="type">${Object.entries(txTypeLabels).map(([v,l])=>`<option value="${v}" ${t.type===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>المبلغ</label><input name="amount" type="number" min="0.01" step="any" value="${t.amount}" required></div><div class="field"><label>العملة</label><select name="currency"><option value="SYP" ${t.currency==='SYP'?'selected':''}>ليرة سورية</option><option value="USD" ${t.currency==='USD'?'selected':''}>دولار</option></select></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${t.date}" required></div><div class="field"><label>التصنيف</label><input name="category" value="${esc(t.category)}"></div><div class="field full"><label>الملاحظة</label><input name="note" value="${esc(t.note)}"></div><div class="field full"><button class="btn" type="submit">حفظ التعديل</button></div></form>`);document.getElementById('editTx').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);Object.assign(t,{type:f.get('type'),amount:Number(f.get('amount')),currency:f.get('currency'),date:f.get('date'),category:f.get('category'),note:f.get('note')});save();closeModal();render();toast('تم تعديل الحركة')}}
function deleteTransaction(tid){if(!confirm('حذف هذه الحركة نهائيًا؟'))return;const t=db.transactions.find(x=>x.id===tid);if(t&&['savings_deposit','savings_withdraw'].includes(t.type)){const key=t.currency==='USD'?'USD':'SYP';db.savings[key]+=t.type==='savings_deposit'?-Number(t.amount):Number(t.amount)}db.transactions=db.transactions.filter(x=>x.id!==tid);save();render();toast('تم حذف الحركة')}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});downloadBlob(blob,`hesabati-backup-${todayISO()}.json`);toast('تم تجهيز النسخة الاحتياطية')}
function exportCSV(from=null,to=null){const tx=db.transactions.filter(t=>(!from||t.date>=from)&&(!to||t.date<=to));const headers=['date','type','amount','currency','category','note','projectId','workerId'];const rows=[headers,...tx.map(t=>headers.map(h=>t[h]??''))];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),`hesabati-transactions-${from||'all'}-${to||todayISO()}.csv`)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.projects)||!Array.isArray(d.transactions)||!Array.isArray(d.workers))throw Error('invalid');if(!confirm('استعادة النسخة ستستبدل البيانات الحالية. هل تريد المتابعة؟'))return;db={...defaultData(),...d,savings:{...defaultData().savings,...d.savings},settings:{...defaultData().settings,...d.settings}};save();render();toast('تمت استعادة النسخة')}catch(err){toast('ملف النسخة غير صالح')}finally{e.target.value=''}});
function resetAll(){if(!confirm('تحذير: سيتم حذف جميع المشاريع والعمال والحركات والمدخرات نهائيًا من هذا المتصفح. هل أنشأت نسخة احتياطية؟'))return;if(!confirm('تأكيد أخير: هل تريد مسح كل البيانات؟'))return;db=defaultData();save();render();toast('تم مسح البيانات')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.installPrompt=e});
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
save();render();
</script>
</body>
